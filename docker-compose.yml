services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-who_is_spy}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PSW:-postgres}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-who_is_spy}"] # 退出码 0 为成功，其他为失败
      interval: 5s # 检测间隔
      timeout: 3s # 每次检测超过 3s 没有响应判定为失败
      retries: 6 # 连续失败 6 次判定为 unhealthy

  app:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      PG_HOST: postgres # 覆盖 PG_HOST 指向容器网络
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()\""]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app

volumes:
  pgdata:

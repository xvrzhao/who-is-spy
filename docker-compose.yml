# 云端整套部署：docker compose --env-file backend/.env up -d --build
#   --env-file backend/.env：配置随 .env 迁入 backend/，插值变量（PG_* / WEB_PORT）从那里读取；
#   app 容器的运行时环境则由下方 env_file 注入（environment 覆盖 PG_HOST 指向容器网络）
# 本地开发（uvicorn + vite 直跑）：docker compose up -d postgres
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-who_is_spy}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PSW:-postgres}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-who_is_spy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 后端 API（仅内部网络，由 web 反代，不直接对外）
  app:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      PG_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 无独立 /health 路由，用 TCP 探活
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 前端：nginx 托管静态资源 + 反代 /api → app（同源，绕开 CORS）
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app

volumes:
  pgdata:
